# Container nginx for the Resilience Maps SPA.
# Host nginx (TLS) proxies to 127.0.0.1:8080; this file runs inside the container.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Range requests are required for PMTiles. Never gzip the archives.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # HTML and the service worker must revalidate so a new build reaches clients.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /workbox-window.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /tiles/ {
        # PMTiles is read with HTTP range requests. gzip would break byte offsets.
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range";
        types {
            application/vnd.pmtiles pmtiles;
            application/octet-stream pmtiles;
        }
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
