services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_VECTOR_PMTILES_URL: ${VITE_VECTOR_PMTILES_URL:-}
        VITE_TERRAIN_PMTILES_URL: ${VITE_TERRAIN_PMTILES_URL:-}
        VITE_MAP_INITIAL_LNG: ${VITE_MAP_INITIAL_LNG:-36.8219}
        VITE_MAP_INITIAL_LAT: ${VITE_MAP_INITIAL_LAT:--1.2921}
        VITE_MAP_INITIAL_ZOOM: ${VITE_MAP_INITIAL_ZOOM:-12}
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
