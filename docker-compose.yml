services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_BASEMAP_PMTILES_URL: ${VITE_BASEMAP_PMTILES_URL:-/tiles/region.pmtiles}
        VITE_TERRAIN_PMTILES_URL: ${VITE_TERRAIN_PMTILES_URL:-/tiles/terrain.pmtiles}
        VITE_FALLBACK_RASTER_TILES_URL: ${VITE_FALLBACK_RASTER_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        VITE_DEFAULT_CENTER: ${VITE_DEFAULT_CENTER:--72.3350,18.5392}
        VITE_DEFAULT_ZOOM: ${VITE_DEFAULT_ZOOM:-12}
    image: resilience-maps:latest
    restart: unless-stopped
    ports:
      # Bound to loopback so a host nginx can terminate TLS in front of it.
      - "127.0.0.1:8080:80"
    volumes:
      - ${TILES_DIR:-./public/tiles}:/usr/share/nginx/html/tiles:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
