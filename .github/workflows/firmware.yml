# Builds the ESP32 relay firmware and runs its host unit test.
name: firmware

on:
  push:
    branches: [main, "claude/**"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware/esp32-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Host unit test (relay_core.h)
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/test_relay_core.cpp -o relay_test && ./relay_test
      - name: Build firmware (esp32dev + esp32-s3)
        run: |
          pip install platformio
          pio run -e esp32dev -e esp32-s3
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: grahmos-relay-firmware
          path: firmware/esp32-relay/.pio/build/*/firmware.bin
          retention-days: 14
