; GrahmOS mesh relay: ESP32 + NimBLE (Nordic UART for phones) + ESP-NOW (relay-to-relay, no Wi-Fi network).
; Build: pio run        Flash: pio run -t upload        Host tests: pio test -e native
[platformio]
default_envs = esp32dev

[common]
lib_deps = h2zero/NimBLE-Arduino@2.5.2
build_flags =
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
  -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
