# gitleaks config (auto-loaded by `gitleaks dir .` in the OSA gate).
# Keeps every default rule. The only exemption: API contracts generated from an upstream's public OpenAPI
# spec, whose request/response examples contain sample tokens (e.g. Chatwoot's example website_token).
# These files are regenerated by osa-kit/adapter and are never hand-edited, so a real secret cannot land there
# without also changing the upstream spec. Everything else in src/ is still scanned.
[extend]
useDefault = true

[allowlist]
description = "Generated upstream API contracts (public spec examples)"
paths = [
  '''^src/core/api/[^/]+/contract\.json$''',
  '''^src/core/api/[^/]+/schema\.ts$''',
]
