# nginx config for Resilience Maps — serves the built SPA and enables
# byte-range requests for .pmtiles archives (required by the PMTiles HTTP
# client). See INSTALLATION_GUIDE.md §6.3.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain application/javascript application/json text/css application/manifest+json;

  location /tiles/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    # nginx supports byte-range (Accept-Ranges) by default for static
    # files, which the PMTiles client relies on to fetch tiles without a
    # tile server.
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
